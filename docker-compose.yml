services:
  dailyhot-api:
    image: imsyy/dailyhot-api:latest
    ports:
      - "6688:6688"
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8900:8900"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5-5}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-low}
      - DAILYHOT_API_URL=http://dailyhot-api:6688
    depends_on:
      - dailyhot-api
    restart: unless-stopped
